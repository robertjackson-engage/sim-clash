name: Bug report
description: Something in the game is broken or looks wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please check the "Known issues" list in docs/arcade-v2.md first. For anything about a launch monitor connecting or sending wrong numbers, use the "Launch monitor report" form instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. A screenshot helps a lot.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where in the game
      description: "For example: the stage (Volcano Drop), the format (best of 3), a match or solo play, which ball was armed"
  - type: input
    id: version
    attributes:
      label: Game version
      description: The number in the installer's file name, or in Windows Settings > Apps > Sim Clash. From source, the commit.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Windows version and graphics card
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: "The last 30 lines of %APPDATA%\\Sim Clash\\logs\\game.log (installed) or of the terminal (from source). Remove anything personal first."
      render: text
